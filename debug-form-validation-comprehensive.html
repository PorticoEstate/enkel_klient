<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Debug Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .debug-container { max-width: 1200px; margin: 2rem auto; padding: 2rem; }
        .console-output { 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            padding: 1rem; 
            margin-top: 1rem; 
            font-family: monospace; 
            white-space: pre-wrap; 
            max-height: 600px; 
            overflow-y: auto;
            font-size: 11px;
        }
        .test-status {
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 0.25rem;
        }
        .test-pass { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .test-fail { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .test-pending { background-color: #fff3cd; border: 1px solid #ffeaa7; color: #856404; }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>Form Validation Debug Test</h1>
        <p>Comprehensive test to debug form validation issues.</p>
        
        <div class="row">
            <div class="col-md-8">
                <div id="test-results">
                    <!-- Test results will be inserted here -->
                </div>
                
                <h3>Test Form</h3>
                <form id="inspection_1" novalidate>
                    <div class="form-group mb-3">
                        <label for="location_name" class="form-label">Location Name (Required) *</label>
                        <input type="text" id="location_name" name="location_name" class="form-control" required aria-required="true" />
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="phone" class="form-label">Phone (Required) *</label>
                        <input type="tel" id="phone" name="phone" class="form-control" required aria-required="true" />
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email (Required) *</label>
                        <input type="email" id="email" name="email" class="form-control" required aria-required="true" />
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                    <button type="button" class="btn btn-secondary" id="test-validation">Test Validation</button>
                    <button type="button" class="btn btn-warning" id="fill-invalid">Fill Invalid Data</button>
                    <button type="button" class="btn btn-success" id="clear-form">Clear Form</button>
                </form>
            </div>
            
            <div class="col-md-4">
                <h3>Debug Output</h3>
                <div id="console-output" class="console-output">Starting debug test...\n</div>
            </div>
        </div>
    </div>

    <!-- Load dependencies -->
    <script src="vendor/components/jquery/jquery.min.js"></script>
    <script>
        // Mock necessary globals
        var strBaseURL = window.location.origin;
        var translations = {
            form_validation_errors: "Please fix the following errors:",
            invalid_email: "Please enter a valid email address",
            invalid_phone: "Please enter a valid phone number",
            field_required: "This field is required"
        };
        
        // Mock form configs for WCAG 3.3.4
        window.formConfigs = {
            inspection_1: {
                form_summary_on_submit: true,
                confirmation_dialog_enabled: false,
                auto_save_enabled: false
            }
        };
    </script>
    
    <!-- Load accessibility helpers -->
    <script src="src/js/accessibility-helpers.js"></script>
    
    <!-- Load form core and extensions -->
    <script src="src/js/form-handler-core.js"></script>
    <script src="src/js/form-extension-loader.js"></script>
    <script src="src/js/extensions/form-validation.js"></script>
    <script src="src/js/extensions/form-confirmation.js"></script>
    
    <script>
        let formHandler = null;
        let testResults = [];
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logMessage = `${timestamp}: ${message}`;
            const consoleOutput = document.getElementById('console-output');
            consoleOutput.textContent += logMessage + '\n';
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            console.log(message);
        }
        
        function addTestResult(name, status, details) {
            testResults.push({ name, status, details });
            updateTestResults();
        }
        
        function updateTestResults() {
            const container = document.getElementById('test-results');
            container.innerHTML = '<h3>Test Results</h3>';
            
            testResults.forEach(test => {
                const div = document.createElement('div');
                div.className = `test-status test-${test.status}`;
                div.innerHTML = `
                    <strong>${test.name}:</strong> ${test.status.toUpperCase()}<br>
                    <small>${test.details}</small>
                `;
                container.appendChild(div);
            });
        }
        
        // Start comprehensive test
        $(document).ready(function() {
            log('🔄 Starting comprehensive form validation debug test...');
            
            // Test 1: Check if dependencies are loaded
            try {
                if (typeof $ === 'undefined') {
                    throw new Error('jQuery not loaded');
                }
                if (typeof FormHandler === 'undefined') {
                    throw new Error('FormHandler not loaded');
                }
                if (typeof FormExtensionLoader === 'undefined') {
                    throw new Error('FormExtensionLoader not loaded');
                }
                if (typeof FormValidationExtension === 'undefined') {
                    throw new Error('FormValidationExtension not loaded');
                }
                
                addTestResult('Dependencies', 'pass', 'All required dependencies loaded');
                log('✅ All dependencies loaded successfully');
            } catch (error) {
                addTestResult('Dependencies', 'fail', error.message);
                log('❌ Dependency error: ' + error.message);
                return;
            }
            
            // Test 2: Initialize form with extensions
            log('📋 Testing form initialization...');
            try {
                formExtensionLoader.quickSetup('inspection_1', 'inspection_1').then(handler => {
                    formHandler = handler;
                    log('✅ Form initialized with quickSetup');
                    addTestResult('Form Initialization', 'pass', 'FormHandler created successfully');
                    
                    // Test 3: Check extensions loaded
                    log('📋 Checking loaded extensions...');
                    const extensionNames = Array.from(formHandler.extensions.keys());
                    log('📋 Loaded extensions: ' + extensionNames.join(', '));
                    
                    if (extensionNames.includes('validation')) {
                        addTestResult('Validation Extension', 'pass', 'Validation extension loaded');
                        log('✅ Validation extension loaded');
                        
                        // Test 4: Check validation extension has beforeSubmit hook
                        const validationExt = formHandler.getExtension('validation');
                        if (validationExt && typeof validationExt.beforeSubmit === 'function') {
                            addTestResult('Validation Hook', 'pass', 'beforeSubmit hook available');
                            log('✅ Validation extension has beforeSubmit hook');
                        } else {
                            addTestResult('Validation Hook', 'fail', 'beforeSubmit hook missing');
                            log('❌ Validation extension missing beforeSubmit hook');
                        }
                        
                        // Test 5: Test hook execution
                        log('📋 Testing hook execution...');
                        try {
                            const hookResult = formHandler.executeHook('beforeSubmit');
                            log('📋 Hook execution result: ' + hookResult);
                            addTestResult('Hook Execution', 'pass', 'Hook executed, returned: ' + hookResult);
                        } catch (error) {
                            log('❌ Hook execution error: ' + error.message);
                            addTestResult('Hook Execution', 'fail', error.message);
                        }
                        
                    } else {
                        addTestResult('Validation Extension', 'fail', 'Validation extension not loaded');
                        log('❌ Validation extension not loaded');
                    }
                    
                    // Test 6: Submit empty form to test validation
                    setTimeout(() => {
                        log('📋 Testing form validation on submit...');
                        testFormSubmission();
                    }, 1000);
                    
                }).catch(error => {
                    addTestResult('Form Initialization', 'fail', error.message);
                    log('❌ Form initialization failed: ' + error.message);
                });
            } catch (error) {
                addTestResult('Form Initialization', 'fail', error.message);
                log('❌ Form initialization error: ' + error.message);
            }
            
            // Set up test buttons
            document.getElementById('test-validation').addEventListener('click', function() {
                testFormSubmission();
            });
            
            document.getElementById('fill-invalid').addEventListener('click', function() {
                log('📝 Filling form with invalid data...');
                document.getElementById('location_name').value = '';
                document.getElementById('phone').value = '123'; // Too short
                document.getElementById('email').value = 'invalid-email';
            });
            
            document.getElementById('clear-form').addEventListener('click', function() {
                log('🗑️ Clearing form...');
                document.getElementById('inspection_1').reset();
                // Clear any validation classes
                document.querySelectorAll('.is-invalid, .is-valid').forEach(el => {
                    el.classList.remove('is-invalid', 'is-valid');
                });
                document.querySelectorAll('.alert').forEach(el => el.remove());
            });
        });
        
        function testFormSubmission() {
            log('🧪 Testing form submission validation...');
            
            if (!formHandler) {
                log('❌ FormHandler not initialized');
                addTestResult('Submit Validation', 'fail', 'FormHandler not available');
                return;
            }
            
            // Try to trigger submit event
            const form = document.getElementById('inspection_1');
            const submitEvent = new Event('submit', { bubbles: true, cancelable: true });
            
            log('📋 Dispatching submit event...');
            const eventDispatched = form.dispatchEvent(submitEvent);
            log('📋 Submit event dispatched: ' + eventDispatched);
            log('📋 Default prevented: ' + submitEvent.defaultPrevented);
            
            // Check for validation errors after a short delay
            setTimeout(() => {
                const errors = document.querySelectorAll('.is-invalid, .alert-danger, .validation-error-summary');
                log('📋 Found ' + errors.length + ' validation error elements');
                
                if (errors.length > 0) {
                    addTestResult('Submit Validation', 'pass', 'Validation errors displayed correctly');
                    log('✅ Form validation working - errors displayed');
                } else {
                    addTestResult('Submit Validation', 'fail', 'No validation errors shown');
                    log('❌ Form validation not working - no errors shown');
                }
            }, 200);
        }
    </script>
</body>
</html>

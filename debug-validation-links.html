<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Form Validation with Links</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .test-container { max-width: 800px; margin: 2rem auto; padding: 2rem; }
        .is-invalid { border-color: #dc3545; }
        .is-valid { border-color: #28a745; }
        .invalid-feedback { display: block; color: #dc3545; font-size: 0.875em; margin-top: 0.25rem; }
        .validation-error-summary { 
            background-color: #f8d7da; 
            border: 1px solid #f5c6cb; 
            color: #721c24; 
            padding: 1rem; 
            margin-bottom: 1rem; 
            border-radius: 0.25rem;
        }
        .validation-error-summary h3 { color: #721c24; font-size: 1.25rem; margin-bottom: 0.5rem; }
        .validation-error-summary ul { margin-bottom: 0; }
        .validation-error-summary a { color: #721c24; text-decoration: underline; }
        .validation-error-summary a:hover { color: #491217; }
        .console-output { 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            padding: 1rem; 
            margin-top: 1rem; 
            font-family: monospace; 
            white-space: pre-wrap; 
            max-height: 300px; 
            overflow-y: auto;
        }
        .sr-only { 
            position: absolute; 
            width: 1px; 
            height: 1px; 
            padding: 0; 
            margin: -1px; 
            overflow: hidden; 
            clip: rect(0,0,0,0); 
            white-space: nowrap; 
            border: 0; 
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Debug Form Validation with Translated Messages & Links</h1>
        <p>This tests the updated validation system with proper field labels and clickable links to focus invalid fields.</p>
        
        <div id="console-output" class="console-output">Console output will appear here...\n</div>
        
        <form id="nokkelbestilling" novalidate>
            <!-- Order on behalf field -->
            <div class="form-group mt-3">
                <label for="paavegne_av" class="form-label">Order on behalf of <span class="text-danger">*</span></label>
                <input type="text" id="paavegne_av" name="paavegne_av" class="form-control" required aria-required="true" />
            </div>
            
            <!-- Phone field -->
            <div class="form-group mt-3">
                <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
                <input type="tel" id="phone" name="phone" class="form-control" required aria-required="true" />
            </div>
            
            <!-- Email field -->
            <div class="form-group mt-3">
                <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                <input type="email" id="email" name="email" class="form-control" required aria-required="true" />
            </div>
            
            <!-- Key number field -->
            <div class="form-group mt-3">
                <label for="key_number" class="form-label">Key Number <span class="text-danger">*</span></label>
                <input type="text" id="key_number" name="key_number" class="form-control" required aria-required="true" />
            </div>
            
            <!-- Number of keys field -->
            <div class="form-group mt-3">
                <label for="number_of_keys" class="form-label">Number of Keys <span class="text-danger">*</span></label>
                <input type="number" id="number_of_keys" name="number_of_keys" class="form-control" required aria-required="true" min="1" />
            </div>
            
            <!-- Subject field -->
            <div class="form-group mt-3">
                <label for="subject" class="form-label">Subject <span class="text-danger">*</span></label>
                <input type="text" id="subject" name="subject" class="form-control" required aria-required="true" value="Key order summary" />
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Submit Form (Test Validation)</button>
                <button type="button" id="fill-valid" class="btn btn-success ms-2">Fill Valid Data</button>
                <button type="button" id="fill-invalid" class="btn btn-warning ms-2">Fill Invalid Data</button>
                <button type="button" id="clear-form" class="btn btn-outline-secondary ms-2">Clear Form</button>
            </div>
        </form>
        
        <div id="form-status" class="sr-only" aria-live="assertive"></div>
    </div>

    <script src="vendor/components/jquery/jquery.min.js"></script>
    <script>
        // Mock translations for testing
        window.translations = {
            form_validation_errors: "Please correct the following errors:",
            field_required: "is required",
            invalid_email: "Please enter a valid email address",
            invalid_phone: "Please enter a valid phone number (minimum 8 digits)"
        };
        
        // Console logging override to capture output
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const consoleOutput = document.getElementById('console-output');
        
        function logToPage(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌ ERROR' : '🔍 LOG';
            consoleOutput.textContent += `[${timestamp}] ${prefix}: ${message}\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            logToPage(args.join(' '));
        };
        
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            logToPage(args.join(' '), 'error');
        };
        
        console.log('🚀 Debug page loaded with translations:', window.translations);
    </script>
    
    <!-- Load the actual form handler system -->
    <script src="src/js/form-handler-core.js"></script>
    <script src="src/js/extensions/form-validation.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔧 DOM loaded, initializing form handler...');
            
            try {
                // Initialize the form handler
                const formHandler = new FormHandler({
                    formId: 'nokkelbestilling',
                    redirectUrl: '/test',
                    extensions: {
                        validation: true
                    }
                });
                
                console.log('✅ Form handler initialized successfully');
                console.log('📋 Available extensions:', FormHandler.extensions ? Object.keys(FormHandler.extensions) : 'None');
                
                // Test buttons
                document.getElementById('fill-valid').addEventListener('click', function() {
                    console.log('📝 Filling form with valid data...');
                    document.getElementById('paavegne_av').value = 'John Doe';
                    document.getElementById('phone').value = '12345678';
                    document.getElementById('email').value = 'john@example.com';
                    document.getElementById('key_number').value = 'KEY123';
                    document.getElementById('number_of_keys').value = '2';
                });
                
                document.getElementById('fill-invalid').addEventListener('click', function() {
                    console.log('❌ Filling form with invalid data...');
                    document.getElementById('paavegne_av').value = 'John Doe';
                    document.getElementById('phone').value = '123'; // Too short
                    document.getElementById('email').value = 'invalid-email'; // Invalid format
                    document.getElementById('key_number').value = 'KEY123';
                    document.getElementById('number_of_keys').value = '2';
                });
                
                document.getElementById('clear-form').addEventListener('click', function() {
                    console.log('🗑️ Clearing form...');
                    document.getElementById('nokkelbestilling').reset();
                    // Clear any validation classes
                    document.querySelectorAll('.is-invalid, .is-valid').forEach(el => {
                        el.classList.remove('is-invalid', 'is-valid');
                    });
                    // Clear error summary
                    const errorSummary = document.querySelector('.validation-error-summary');
                    if (errorSummary) {
                        errorSummary.remove();
                    }
                });
                
            } catch (error) {
                console.error('❌ Failed to initialize form handler:', error);
            }
        });
    </script>
</body>
</html>

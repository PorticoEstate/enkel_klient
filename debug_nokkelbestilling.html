<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Nokkelbestilling Form Configuration</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Debug Nokkelbestilling Form Configuration</h1>
    
    <div id="debug-output"></div>
    
    <script>
        // Simulate the configuration setup like in nokkelbestilling.twig
        window.formConfigs = window.formConfigs || {};
        window.formConfigs['nokkelbestilling'] = {
            form_summary_on_submit: true,
            confirmation_dialog_enabled: false,
            auto_save_enabled: true,
            change_tracking_enabled: true
        };
        
        // Debug information
        const debugInfo = {
            configExists: typeof window.formConfigs !== 'undefined',
            nokkelbestillingConfigExists: typeof window.formConfigs['nokkelbestilling'] !== 'undefined',
            formSummaryEnabled: window.formConfigs['nokkelbestilling']?.form_summary_on_submit,
            confirmationDialogEnabled: window.formConfigs['nokkelbestilling']?.confirmation_dialog_enabled,
            fullConfig: window.formConfigs['nokkelbestilling']
        };
        
        document.getElementById('debug-output').innerHTML = `
            <h2>Configuration Debug</h2>
            <pre>${JSON.stringify(debugInfo, null, 2)}</pre>
            
            <h2>Expected Behavior</h2>
            <p>With form_summary_on_submit = true, the form should show a summary modal before submission.</p>
            
            <h2>FormHandler Simulation</h2>
            <div id="handler-debug"></div>
        `;
        
        // Simulate FormHandler configuration loading
        function simulateConfigLoading(formId) {
            let formConfig = {};
            let formSummaryEnabled = false;
            
            console.log('Simulating FormHandler.loadFormConfiguration()');
            
            // Try to get configuration from global window object (if available)
            if (typeof window.formConfigs !== 'undefined' && window.formConfigs[formId]) {
                formConfig = window.formConfigs[formId];
                console.log(`Configuration found for ${formId}:`, formConfig);
            } else {
                // Default configuration
                formConfig = {
                    form_summary_on_submit: false,
                    confirmation_dialog: false,
                    auto_save: false,
                    validation_level: 'standard'
                };
                console.log(`Using default configuration for ${formId}:`, formConfig);
            }
            
            // Set flags based on configuration
            formSummaryEnabled = formConfig.form_summary_on_submit === true;
            
            return {
                formConfig,
                formSummaryEnabled,
                confirmationDialogEnabled: formConfig.confirmation_dialog === true
            };
        }
        
        const handlerResult = simulateConfigLoading('nokkelbestilling');
        
        document.getElementById('handler-debug').innerHTML = `
            <h3>FormHandler Configuration Result:</h3>
            <pre>${JSON.stringify(handlerResult, null, 2)}</pre>
            
            <p><strong>Form Summary Enabled:</strong> ${handlerResult.formSummaryEnabled ? 'YES' : 'NO'}</p>
            <p><strong>Expected Modal:</strong> ${handlerResult.formSummaryEnabled ? 'Should show form summary modal' : 'Will skip to direct submission'}</p>
        `;
    </script>
</body>
</html>

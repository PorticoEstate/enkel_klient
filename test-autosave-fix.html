<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autosave Extension Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1>Testing Autosave Extension with File Inputs</h1>
    
    <form id="test-form">
        <div>
            <label for="text-field">Text Field:</label>
            <input type="text" name="text-field" id="text-field" placeholder="Type something...">
        </div>
        
        <div>
            <label for="email-field">Email Field:</label>
            <input type="email" name="email-field" id="email-field" placeholder="email@example.com">
        </div>
        
        <div>
            <label for="file-field">File Field (should be skipped):</label>
            <input type="file" name="files[]" id="file-field" multiple>
        </div>
        
        <div>
            <label for="textarea-field">Textarea:</label>
            <textarea name="message" id="textarea-field" placeholder="Enter message..."></textarea>
        </div>
        
        <button type="submit">Submit</button>
    </form>

    <div id="test-results">
        <h2>Autosave Test Results</h2>
        <p>Fill out the form and watch the console for autosave activity.</p>
        <button onclick="clearAutosave()">Clear Autosave Data</button>
        <button onclick="showSavedData()">Show Saved Data</button>
    </div>

    <script>
        var strBaseURL = '/';
        
        // Mock FormHandler for testing
        class FormHandler {
            constructor(options) {
                this.formId = options.formId;
                this.$form = $('#' + this.formId);
                this.form = document.getElementById(this.formId);
            }
            
            static extensions = {};
            static registerExtension(name, extensionClass) {
                console.log(`Registering extension: ${name}`);
                this.extensions[name] = extensionClass;
            }
            
            getFormId() { return this.formId; }
            getForm() { return this.$form; }
            getFormElement() { return this.form; }
        }
        
        window.FormHandler = FormHandler;
    </script>

    <!-- Load the autosave extension -->
    <script src="src/js/extensions/form-autosave.js"></script>

    <script>
        // Initialize form handler with autosave
        const formHandler = new FormHandler({ formId: 'test-form' });
        const autosave = new FormAutoSaveExtension(formHandler, {
            interval: 5000 // Save every 5 seconds for testing
        });
        
        function clearAutosave() {
            localStorage.removeItem('autosave_test-form');
            console.log('Autosave data cleared');
        }
        
        function showSavedData() {
            const saved = localStorage.getItem('autosave_test-form');
            if (saved) {
                console.log('Saved autosave data:', JSON.parse(saved));
                alert('Check console for saved data');
            } else {
                alert('No autosave data found');
            }
        }
        
        console.log('✅ Autosave test initialized successfully');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dynamic Extension Loading</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="container mt-4">
        <h1>Dynamic Extension Loading Test</h1>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Test Form (Helpdesk-like)</h3>
                <form id="test-form" data-extensions='{"validation":{"realTimeValidation":true},"accessibility":{"announceErrors":true},"autoSave":{"enabled":true}}'>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
            
            <div class="col-md-6">
                <h3>Extension Loading Status</h3>
                <div id="loading-status">
                    <p>Loading form system...</p>
                </div>
                
                <h4>Console Output</h4>
                <div id="console-output" class="border p-2" style="height: 300px; overflow-y: scroll; font-family: monospace; font-size: 12px;">
                </div>
            </div>
        </div>
    </div>

    <!-- Core system -->
    <script src="src/js/form-handler-core.js"></script>
    <script src="src/js/form-extension-loader.js"></script>
    
    <script>
        // Capture console output
        const originalLog = console.log;
        const originalError = console.error;
        const originalWarn = console.warn;
        const outputDiv = document.getElementById('console-output');
        
        function addToOutput(type, message) {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<span style="color: gray;">[${timestamp}]</span> <span style="color: ${type === 'error' ? 'red' : type === 'warn' ? 'orange' : 'green'};">${message}</span>`;
            outputDiv.appendChild(div);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
        
        console.log = function(message) {
            originalLog.apply(console, arguments);
            addToOutput('log', message);
        };
        
        console.error = function(message) {
            originalError.apply(console, arguments);
            addToOutput('error', message);
        };
        
        console.warn = function(message) {
            originalWarn.apply(console, arguments);
            addToOutput('warn', message);
        };

        // Test the dynamic loading system
        document.addEventListener('DOMContentLoaded', async function() {
            const statusDiv = document.getElementById('loading-status');
            
            try {
                console.log('🚀 Starting dynamic extension loading test');
                
                // Check if FormExtensionLoader is available
                if (typeof FormExtensionLoader === 'undefined') {
                    throw new Error('FormExtensionLoader not available');
                }
                
                const loader = new FormExtensionLoader();
                console.log('✅ FormExtensionLoader instantiated');
                
                // Load configuration for test form
                const config = await loader.loadFormConfiguration('test-form');
                console.log('📋 Configuration loaded:', JSON.stringify(config, null, 2));
                
                // Create FormHandler with dynamic loading
                const formHandler = await loader.createFormHandler(config);
                console.log('✅ FormHandler created successfully');
                
                statusDiv.innerHTML = `
                    <div class="alert alert-success">
                        <h5>✅ Dynamic Loading Test Successful!</h5>
                        <ul>
                            <li>FormExtensionLoader: Available</li>
                            <li>Configuration: Loaded from data attributes</li>
                            <li>Extensions: Dynamically loaded</li>
                            <li>FormHandler: Successfully created</li>
                        </ul>
                    </div>
                `;
                
                // Test form functionality
                const form = document.getElementById('test-form');
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    console.log('📝 Form submission intercepted (test successful)');
                    alert('Form validation and submission working!');
                });
                
            } catch (error) {
                console.error('❌ Test failed:', error.message);
                statusDiv.innerHTML = `
                    <div class="alert alert-danger">
                        <h5>❌ Dynamic Loading Test Failed</h5>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>

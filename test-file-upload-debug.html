<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Debug Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>File Upload Debug Test</h1>
    
    <div class="test-section">
        <h2>1. Check Basic Elements</h2>
        <div id="basic-check"></div>
    </div>
    
    <div class="test-section">
        <h2>2. Check JavaScript Functions</h2>
        <div id="js-check"></div>
    </div>
    
    <div class="test-section">
        <h2>3. Check Accessibility Helpers</h2>
        <div id="accessibility-check"></div>
    </div>
    
    <div class="test-section">
        <h2>4. Simulate File Upload Elements</h2>
        <div id="file-upload-test">
            <div id="drop-area">
                <input type="file" id="fileupload" name="files[]" multiple>
                <button type="button" id="file-select-btn">Select Files</button>
            </div>
        </div>
        <div id="simulation-result"></div>
    </div>

    <script>
        $(document).ready(function() {
            console.log('Starting file upload debug test...');
            
            // Test 1: Check basic elements
            $('#basic-check').html(`
                <p class="info">Checking DOM elements...</p>
                <p>jQuery: ${typeof $ !== 'undefined' ? '✅ Available' : '❌ Missing'}</p>
                <p>Drop area exists: ${$('#drop-area').length > 0 ? '✅ Yes' : '❌ No'}</p>
                <p>File input exists: ${$('#fileupload').length > 0 ? '✅ Yes' : '❌ No'}</p>
                <p>File select button exists: ${$('#file-select-btn').length > 0 ? '✅ Yes' : '❌ No'}</p>
            `);
            
            // Test 2: Check JavaScript functions
            let jsResults = '<p class="info">Checking JavaScript availability...</p>';
            jsResults += `<p>FileUploader class: ${typeof FileUploader !== 'undefined' ? '✅ Available' : '❌ Missing'}</p>`;
            jsResults += `<p>FormHandler class: ${typeof FormHandler !== 'undefined' ? '✅ Available' : '❌ Missing'}</p>`;
            jsResults += `<p>jQuery fileupload plugin: ${$.fn.fileupload ? '✅ Available' : '❌ Missing'}</p>`;
            jsResults += `<p>makeInputsAccessible function: ${typeof makeInputsAccessible !== 'undefined' ? '✅ Available' : '❌ Missing'}</p>`;
            $('#js-check').html(jsResults);
            
            // Test 3: Check accessibility helpers
            let a11yResults = '<p class="info">Loading accessibility helpers script...</p>';
            
            // Load accessibility helpers
            $.getScript('/src/js/accessibility-helpers.js')
                .done(function() {
                    a11yResults += '<p class="success">✅ Accessibility helpers loaded successfully</p>';
                    a11yResults += `<p>makeInputsAccessible function: ${typeof makeInputsAccessible !== 'undefined' ? '✅ Now Available' : '❌ Still Missing'}</p>`;
                    $('#accessibility-check').html(a11yResults);
                    
                    // Test the function
                    if (typeof makeInputsAccessible !== 'undefined') {
                        try {
                            const form = document.querySelector('form') || document.createElement('form');
                            makeInputsAccessible(form);
                            a11yResults += '<p class="success">✅ makeInputsAccessible function executed successfully</p>';
                        } catch (error) {
                            a11yResults += `<p class="error">❌ makeInputsAccessible function error: ${error.message}</p>`;
                        }
                        $('#accessibility-check').html(a11yResults);
                    }
                })
                .fail(function() {
                    a11yResults += '<p class="error">❌ Failed to load accessibility helpers</p>';
                    $('#accessibility-check').html(a11yResults);
                });
            
            // Test 4: Load and test FileUploader
            $('#simulation-result').html('<p class="info">Testing FileUploader...</p>');
            
            // Load FileUploader
            $.getScript('/src/js/file-uploader.js')
                .done(function() {
                    let simResult = '<p class="success">✅ FileUploader script loaded</p>';
                    
                    if (typeof FileUploader !== 'undefined') {
                        simResult += '<p class="success">✅ FileUploader class available</p>';
                        
                        // Try to create FileUploader instance
                        try {
                            const uploader = new FileUploader({
                                formId: 'test-form',
                                fileInputId: 'fileupload',
                                dropAreaId: 'drop-area',
                                uploadUrl: '/test-upload'
                            });
                            
                            simResult += '<p class="success">✅ FileUploader instance created</p>';
                            
                            // Try to initialize
                            if (uploader.initialize) {
                                const initResult = uploader.initialize();
                                simResult += `<p class="${initResult ? 'success' : 'error'}">${initResult ? '✅' : '❌'} FileUploader initialization: ${initResult}</p>`;
                            } else {
                                simResult += '<p class="error">❌ FileUploader.initialize method not found</p>';
                            }
                            
                        } catch (error) {
                            simResult += `<p class="error">❌ FileUploader error: ${error.message}</p>`;
                        }
                    } else {
                        simResult += '<p class="error">❌ FileUploader class not available after loading script</p>';
                    }
                    
                    $('#simulation-result').html(simResult);
                })
                .fail(function() {
                    $('#simulation-result').html('<p class="error">❌ Failed to load FileUploader script</p>');
                });
        });
    </script>
</body>
</html>

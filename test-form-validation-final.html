<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Final Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .test-container { max-width: 1000px; margin: 2rem auto; padding: 2rem; }
        .console-output { 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            padding: 1rem; 
            margin-top: 1rem; 
            font-family: monospace; 
            white-space: pre-wrap; 
            max-height: 400px; 
            overflow-y: auto;
            font-size: 11px;
        }
        .test-result {
            margin: 0.5rem 0;
            padding: 0.5rem;
            border-radius: 0.25rem;
        }
        .test-pass { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .test-fail { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .is-invalid { border-left: 4px solid #dc3545; }
        .validation-error-summary { 
            background-color: #f8d7da; 
            border: 1px solid #f5c6cb; 
            color: #721c24; 
            padding: 1rem; 
            margin: 1rem 0;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Form Validation Final Test</h1>
        <p>Testing if form validation is working correctly after syntax fixes.</p>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Test Results</h3>
                <div id="test-results">
                    <!-- Results will be populated here -->
                </div>
                
                <div class="mt-3">
                    <button type="button" class="btn btn-primary" id="run-full-test">🚀 Run Full Test</button>
                    <button type="button" class="btn btn-secondary" id="test-extension-loading">📋 Test Extension Loading</button>
                    <button type="button" class="btn btn-warning" id="test-validation-hook">🔍 Test Validation Hook</button>
                </div>
            </div>
            
            <div class="col-md-6">
                <h3>Test Form</h3>
                <form id="inspection_1" novalidate>
                    <div class="form-group mb-3">
                        <label for="location_name" class="form-label">Location Name (Required) *</label>
                        <input type="text" id="location_name" name="location_name" class="form-control" required />
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="phone" class="form-label">Phone (Required) *</label>
                        <input type="tel" id="phone" name="phone" class="form-control" required />
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email (Required) *</label>
                        <input type="email" id="email" name="email" class="form-control" required />
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                    <button type="button" class="btn btn-success" id="fill-valid">Fill Valid Data</button>
                    <button type="button" class="btn btn-danger" id="fill-invalid">Fill Invalid Data</button>
                    <button type="button" class="btn btn-secondary" id="clear-form">Clear Form</button>
                </form>
            </div>
        </div>
        
        <div id="console-output" class="console-output">🔄 Initializing final validation test...\n</div>
    </div>

    <!-- Dependencies -->
    <script src="vendor/components/jquery/jquery.min.js"></script>
    <script>
        var strBaseURL = window.location.origin;
        var translations = {
            form_validation_errors: "Please fix the following errors:",
            invalid_email: "Please enter a valid email address",
            invalid_phone: "Please enter a valid phone number",
            field_required: "This field is required"
        };
        
        window.formConfigs = {
            inspection_1: {
                form_summary_on_submit: true,
                confirmation_dialog_enabled: false,
                auto_save_enabled: false
            }
        };
    </script>
    
    <!-- Form system -->
    <script src="src/js/accessibility-helpers.js"></script>
    <script src="src/js/form-handler-core.js"></script>
    <script src="src/js/form-extension-loader.js"></script>
    <script src="src/js/extensions/form-validation.js"></script>
    <script src="src/js/extensions/form-confirmation.js"></script>
    
    <script>
        let formHandler = null;
        let testResults = [];
        
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const consoleOutput = document.getElementById('console-output');
            consoleOutput.textContent += `${timestamp}: ${message}\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            console.log(message);
        }
        
        function addTestResult(name, passed, details) {
            const result = { name, passed, details };
            testResults.push(result);
            
            const container = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `test-result ${passed ? 'test-pass' : 'test-fail'}`;
            div.innerHTML = `<strong>${name}:</strong> ${passed ? '✅ PASS' : '❌ FAIL'}<br><small>${details}</small>`;
            container.appendChild(div);
        }
        
        $(document).ready(function() {
            log('🔄 Starting comprehensive validation test...');
            
            // Test button handlers
            document.getElementById('run-full-test').addEventListener('click', runFullTest);
            document.getElementById('test-extension-loading').addEventListener('click', testExtensionLoading);
            document.getElementById('test-validation-hook').addEventListener('click', testValidationHook);
            
            // Form utility buttons
            document.getElementById('fill-valid').addEventListener('click', function() {
                log('📝 Filling valid data...');
                document.getElementById('location_name').value = 'Test Location';
                document.getElementById('phone').value = '12345678';
                document.getElementById('email').value = 'test@example.com';
            });
            
            document.getElementById('fill-invalid').addEventListener('click', function() {
                log('📝 Filling invalid data...');
                document.getElementById('location_name').value = '';
                document.getElementById('phone').value = '123'; // Too short
                document.getElementById('email').value = 'invalid-email';
            });
            
            document.getElementById('clear-form').addEventListener('click', function() {
                log('🗑️ Clearing form...');
                document.getElementById('inspection_1').reset();
                document.querySelectorAll('.is-invalid, .is-valid').forEach(el => {
                    el.classList.remove('is-invalid', 'is-valid');
                });
                document.querySelectorAll('.alert, .validation-error-summary').forEach(el => el.remove());
            });
            
            // Auto-run initial test
            setTimeout(testExtensionLoading, 500);
        });
        
        function testExtensionLoading() {
            log('📋 Testing extension loading...');
            
            try {
                // Check dependencies
                if (typeof FormHandler === 'undefined') {
                    addTestResult('FormHandler Loading', false, 'FormHandler class not found');
                    return;
                }
                
                if (typeof FormValidationExtension === 'undefined') {
                    addTestResult('Validation Extension Loading', false, 'FormValidationExtension class not found');
                    return;
                }
                
                if (typeof FormExtensionLoader === 'undefined') {
                    addTestResult('Extension Loader Loading', false, 'FormExtensionLoader class not found');
                    return;
                }
                
                addTestResult('Dependencies Loading', true, 'All required classes loaded');
                log('✅ All dependencies loaded successfully');
                
                // Test extension registration
                log('📋 Testing extension registration...');
                if (FormHandler.extensions && FormHandler.extensions.validation) {
                    addTestResult('Extension Registration', true, 'Validation extension registered in FormHandler.extensions');
                    log('✅ Validation extension registered');
                } else {
                    addTestResult('Extension Registration', false, 'Validation extension not found in registry');
                    log('❌ Validation extension not registered');
                }
                
                // Initialize form
                setTimeout(initializeFormHandler, 100);
                
            } catch (error) {
                addTestResult('Extension Loading', false, error.message);
                log('❌ Extension loading error: ' + error.message);
            }
        }
        
        function initializeFormHandler() {
            log('📋 Testing form handler initialization...');
            
            try {
                formExtensionLoader.quickSetup('inspection_1', 'inspection_1').then(handler => {
                    formHandler = handler;
                    log('✅ FormHandler initialized successfully');
                    addTestResult('Form Initialization', true, 'FormHandler created with quickSetup');
                    
                    // Test extension loading in handler
                    const extensionNames = Array.from(formHandler.extensions.keys());
                    log('📋 Loaded extensions in handler: ' + extensionNames.join(', '));
                    
                    if (extensionNames.includes('validation')) {
                        addTestResult('Handler Extension Loading', true, 'Validation extension loaded in handler');
                        setTimeout(testValidationHook, 100);
                    } else {
                        addTestResult('Handler Extension Loading', false, 'Validation extension not loaded in handler');
                    }
                    
                }).catch(error => {
                    addTestResult('Form Initialization', false, error.message);
                    log('❌ Form initialization failed: ' + error.message);
                });
                
            } catch (error) {
                addTestResult('Form Initialization', false, error.message);
                log('❌ Form initialization error: ' + error.message);
            }
        }
        
        function testValidationHook() {
            log('🔍 Testing validation hook...');
            
            if (!formHandler) {
                addTestResult('Validation Hook', false, 'FormHandler not initialized');
                return;
            }
            
            try {
                const validationExt = formHandler.getExtension('validation');
                if (!validationExt) {
                    addTestResult('Validation Extension Access', false, 'Cannot access validation extension');
                    return;
                }
                
                if (typeof validationExt.beforeSubmit !== 'function') {
                    addTestResult('beforeSubmit Hook', false, 'beforeSubmit method not found');
                    return;
                }
                
                addTestResult('beforeSubmit Hook', true, 'beforeSubmit method available');
                log('✅ beforeSubmit hook found');
                
                // Test hook execution with empty form (should fail validation)
                log('📋 Testing hook execution with empty form...');
                const hookResult = formHandler.executeHook('beforeSubmit');
                log('📋 Hook execution result: ' + hookResult);
                
                if (hookResult === false) {
                    addTestResult('Validation Logic', true, 'Empty form correctly failed validation');
                    log('✅ Validation correctly rejected empty form');
                } else {
                    addTestResult('Validation Logic', false, 'Empty form incorrectly passed validation');
                    log('❌ Validation incorrectly accepted empty form');
                }
                
                setTimeout(testFormSubmission, 100);
                
            } catch (error) {
                addTestResult('Validation Hook', false, error.message);
                log('❌ Validation hook error: ' + error.message);
            }
        }
        
        function testFormSubmission() {
            log('🧪 Testing form submission validation...');
            
            try {
                // Clear any existing errors
                document.querySelectorAll('.is-invalid, .alert, .validation-error-summary').forEach(el => {
                    if (el.classList) {
                        el.classList.remove('is-invalid');
                    } else {
                        el.remove();
                    }
                });
                
                // Try to submit empty form
                const form = document.getElementById('inspection_1');
                const submitEvent = new Event('submit', { bubbles: true, cancelable: true });
                
                log('📋 Dispatching submit event on empty form...');
                const eventDispatched = form.dispatchEvent(submitEvent);
                log('📋 Submit event dispatched: ' + eventDispatched);
                log('📋 Default prevented: ' + submitEvent.defaultPrevented);
                
                // Check for validation errors after a delay
                setTimeout(() => {
                    const errorElements = document.querySelectorAll('.is-invalid, .alert-danger, .validation-error-summary');
                    log('📋 Found ' + errorElements.length + ' validation error elements');
                    
                    if (errorElements.length > 0) {
                        addTestResult('Form Submission Validation', true, `${errorElements.length} validation errors correctly displayed`);
                        log('✅ Form submission validation working - errors displayed');
                        
                        // List the errors found
                        errorElements.forEach((el, index) => {
                            log(`   Error ${index + 1}: ${el.tagName} - ${el.textContent.substring(0, 50)}...`);
                        });
                        
                    } else {
                        addTestResult('Form Submission Validation', false, 'No validation errors displayed');
                        log('❌ Form submission validation not working - no errors shown');
                    }
                    
                    // Test with valid data
                    setTimeout(testValidFormSubmission, 200);
                }, 300);
                
            } catch (error) {
                addTestResult('Form Submission', false, error.message);
                log('❌ Form submission test error: ' + error.message);
            }
        }
        
        function testValidFormSubmission() {
            log('📝 Testing form submission with valid data...');
            
            // Fill form with valid data
            document.getElementById('location_name').value = 'Test Location';
            document.getElementById('phone').value = '12345678';
            document.getElementById('email').value = 'test@example.com';
            
            try {
                // Test validation with valid data
                const hookResult = formHandler.executeHook('beforeSubmit');
                log('📋 Valid form hook result: ' + hookResult);
                
                if (hookResult === true) {
                    addTestResult('Valid Form Validation', true, 'Valid form correctly passed validation');
                    log('✅ Valid form correctly passed validation');
                } else {
                    addTestResult('Valid Form Validation', false, 'Valid form incorrectly failed validation');
                    log('❌ Valid form incorrectly failed validation');
                }
                
                log('🎉 Form validation test completed!');
                
            } catch (error) {
                addTestResult('Valid Form Test', false, error.message);
                log('❌ Valid form test error: ' + error.message);
            }
        }
        
        function runFullTest() {
            log('🚀 Running full comprehensive test...');
            
            // Clear previous results
            document.getElementById('test-results').innerHTML = '<h3>Test Results</h3>';
            testResults = [];
            
            // Clear form
            document.getElementById('inspection_1').reset();
            document.querySelectorAll('.is-invalid, .is-valid, .alert, .validation-error-summary').forEach(el => {
                if (el.classList) {
                    el.classList.remove('is-invalid', 'is-valid');
                } else {
                    el.remove();
                }
            });
            
            // Run tests in sequence
            setTimeout(testExtensionLoading, 100);
        }
    </script>
</body>
</html>

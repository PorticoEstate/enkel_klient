<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Form Validation - Working Check</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .test-container { max-width: 800px; margin: 2rem auto; padding: 2rem; }
        .console-output { 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            padding: 1rem; 
            margin-top: 1rem; 
            font-family: monospace; 
            white-space: pre-wrap; 
            max-height: 400px; 
            overflow-y: auto;
            font-size: 12px;
        }
        .is-invalid { border-color: #dc3545; }
        .validation-error-summary {
            background-color: #f8d7da; 
            border: 1px solid #f5c6cb; 
            color: #721c24; 
            padding: 1rem; 
            margin-bottom: 1rem; 
            border-radius: 0.25rem;
        }
        .status-indicator {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
        }
        .status-pass { background-color: #28a745; }
        .status-fail { background-color: #dc3545; }
        .status-pending { background-color: #ffc107; }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Form Validation Test - Working Check</h1>
        <p>Testing if form validation works correctly after the quickSetup() parameter fixes.</p>
        
        <div class="row">
            <div class="col-md-6">
                <h3>Test Status</h3>
                <div id="test-status">
                    <div><span class="status-indicator status-pending"></span> Extension Loading</div>
                    <div><span class="status-indicator status-pending"></span> Form Initialization</div>
                    <div><span class="status-indicator status-pending"></span> Validation Hooks</div>
                    <div><span class="status-indicator status-pending"></span> Submit Validation</div>
                </div>
                
                <button type="button" class="btn btn-primary mt-3" id="test-submit">Test Submit (Empty Form)</button>
                <button type="button" class="btn btn-success mt-3" id="fill-valid">Fill Valid Data</button>
                <button type="button" class="btn btn-danger mt-3" id="fill-invalid">Fill Invalid Data</button>
            </div>
            
            <div class="col-md-6">
                <h3>Test Form</h3>
                <form id="test-form" novalidate>
                    <div class="form-group mb-3">
                        <label for="name" class="form-label">Name (Required) *</label>
                        <input type="text" id="name" name="name" class="form-control" required aria-required="true" />
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="email" class="form-label">Email (Required) *</label>
                        <input type="email" id="email" name="email" class="form-control" required aria-required="true" />
                    </div>
                    
                    <div class="form-group mb-3">
                        <label for="phone" class="form-label">Phone (Required) *</label>
                        <input type="tel" id="phone" name="phone" class="form-control" required aria-required="true" />
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                </form>
            </div>
        </div>
        
        <div id="console-output" class="console-output">Initializing test...\n</div>
    </div>

    <!-- Load dependencies in correct order -->
    <script src="vendor/components/jquery/jquery.min.js"></script>
    <script>
        var strBaseURL = window.location.origin;
        var translations = {
            form_validation_errors: "Please fix the following errors:",
            invalid_email: "Please enter a valid email address",
            invalid_phone: "Please enter a valid phone number",
            field_required: "This field is required"
        };
    </script>
    
    <!-- Load accessibility helpers -->
    <script src="src/js/accessibility-helpers.js"></script>
    
    <!-- Load form core and extensions -->
    <script src="src/js/form-handler-core.js"></script>
    <script src="src/js/form-extension-loader.js"></script>
    <script src="src/js/extensions/form-validation.js"></script>
    
    <script>
        let testResults = {
            extensionLoading: false,
            formInitialization: false,
            validationHooks: false,
            submitValidation: false
        };
        
        let formHandler = null;
        
        function updateConsole(message) {
            const console_output = document.getElementById('console-output');
            console_output.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            console_output.scrollTop = console_output.scrollHeight;
            console.log(message);
        }
        
        function updateTestStatus(test, passed) {
            testResults[test] = passed;
            const statusElements = document.querySelectorAll('#test-status div');
            const tests = ['extensionLoading', 'formInitialization', 'validationHooks', 'submitValidation'];
            
            tests.forEach((testName, index) => {
                const indicator = statusElements[index].querySelector('.status-indicator');
                if (testResults[testName] === true) {
                    indicator.className = 'status-indicator status-pass';
                } else if (testResults[testName] === false) {
                    indicator.className = 'status-indicator status-fail';
                } else {
                    indicator.className = 'status-indicator status-pending';
                }
            });
        }
        
        // Initialize test
        $(document).ready(function() {
            updateConsole('🔄 Starting form validation test...');
            
            // Test 1: Extension Loading
            updateConsole('📋 Testing extension loading...');
            try {
                if (typeof FormValidationExtension !== 'undefined') {
                    updateConsole('✅ FormValidationExtension found');
                    updateTestStatus('extensionLoading', true);
                } else {
                    updateConsole('❌ FormValidationExtension not found');
                    updateTestStatus('extensionLoading', false);
                    return;
                }
            } catch (error) {
                updateConsole('❌ Error checking extensions: ' + error.message);
                updateTestStatus('extensionLoading', false);
                return;
            }
            
            // Test 2: Form Initialization
            updateConsole('📋 Testing form initialization...');
            try {
                formExtensionLoader.quickSetup('test-form', 'test').then(handler => {
                    formHandler = handler;
                    updateConsole('✅ Form initialized successfully');
                    updateTestStatus('formInitialization', true);
                    
                    // Test 3: Validation Hooks
                    updateConsole('📋 Testing validation hooks...');
                    if (formHandler.executeHook) {
                        const hookResult = formHandler.executeHook('beforeSubmit');
                        updateConsole('📋 beforeSubmit hook result: ' + hookResult);
                        updateTestStatus('validationHooks', true);
                    } else {
                        updateConsole('❌ executeHook method not found');
                        updateTestStatus('validationHooks', false);
                    }
                    
                }).catch(error => {
                    updateConsole('❌ Form initialization failed: ' + error.message);
                    updateTestStatus('formInitialization', false);
                });
            } catch (error) {
                updateConsole('❌ Error during form initialization: ' + error.message);
                updateTestStatus('formInitialization', false);
            }
            
            // Test submit button
            document.getElementById('test-submit').addEventListener('click', function() {
                updateConsole('🧪 Testing form submission with empty fields...');
                const form = document.getElementById('test-form');
                const submitEvent = new Event('submit', { bubbles: true, cancelable: true });
                form.dispatchEvent(submitEvent);
                
                // Check if validation prevented submission
                setTimeout(() => {
                    const errors = document.querySelectorAll('.is-invalid, .alert-danger');
                    if (errors.length > 0) {
                        updateConsole('✅ Validation correctly prevented submission');
                        updateTestStatus('submitValidation', true);
                    } else {
                        updateConsole('❌ Validation did not prevent submission');
                        updateTestStatus('submitValidation', false);
                    }
                }, 100);
            });
            
            // Fill valid data button
            document.getElementById('fill-valid').addEventListener('click', function() {
                updateConsole('📝 Filling form with valid data...');
                document.getElementById('name').value = 'John Doe';
                document.getElementById('email').value = 'john@example.com';
                document.getElementById('phone').value = '12345678';
            });
            
            // Fill invalid data button
            document.getElementById('fill-invalid').addEventListener('click', function() {
                updateConsole('📝 Filling form with invalid data...');
                document.getElementById('name').value = 'John Doe';
                document.getElementById('email').value = 'invalid-email';
                document.getElementById('phone').value = '123'; // Too short
            });
        });
    </script>
</body>
</html>

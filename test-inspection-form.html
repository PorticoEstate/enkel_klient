<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspection Form Test</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="date"], textarea, select { 
            width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; 
        }
        textarea { height: 120px; resize: vertical; }
        button { 
            background: #007cba; color: white; padding: 12px 24px; 
            border: none; border-radius: 4px; cursor: pointer; font-size: 16px; 
        }
        button:hover { background: #005a87; }
        .error { color: #d32f2f; font-size: 14px; margin-top: 5px; }
        .form-summary { 
            background: #f5f5f5; padding: 20px; border-radius: 4px; margin: 20px 0; 
            border-left: 4px solid #007cba; 
        }
        .form-summary h3 { margin-top: 0; color: #007cba; }
        .form-summary .summary-field { margin-bottom: 10px; }
        .form-summary .summary-label { font-weight: bold; }
        .form-summary .summary-value { margin-left: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>Inspection Form Test</h1>
    <p>Testing the migrated inspection form with validation and confirmation summary.</p>

    <form id="inspection1Form" data-form-type="inspection_1" data-form-summary-on-submit="true">
        <div class="form-group">
            <label for="property_address">Property Address (required):</label>
            <input type="text" id="property_address" name="property_address" required aria-describedby="property_address-error">
            <div id="property_address-error" class="error" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="contact_name">Contact Name (required):</label>
            <input type="text" id="contact_name" name="contact_name" required aria-describedby="contact_name-error">
            <div id="contact_name-error" class="error" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="contact_email">Contact Email (required):</label>
            <input type="email" id="contact_email" name="contact_email" required aria-describedby="contact_email-error">
            <div id="contact_email-error" class="error" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="contact_phone">Contact Phone:</label>
            <input type="text" id="contact_phone" name="contact_phone" aria-describedby="contact_phone-error">
            <div id="contact_phone-error" class="error" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="inspection_date">Preferred Inspection Date (required):</label>
            <input type="date" id="inspection_date" name="inspection_date" required aria-describedby="inspection_date-error">
            <div id="inspection_date-error" class="error" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="inspection_type">Inspection Type (required):</label>
            <select id="inspection_type" name="inspection_type" required aria-describedby="inspection_type-error">
                <option value="">Select inspection type...</option>
                <option value="pre_purchase">Pre-Purchase Inspection</option>
                <option value="pre_sale">Pre-Sale Inspection</option>
                <option value="maintenance">Maintenance Inspection</option>
                <option value="insurance">Insurance Inspection</option>
            </select>
            <div id="inspection_type-error" class="error" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="property_type">Property Type:</label>
            <select id="property_type" name="property_type" aria-describedby="property_type-error">
                <option value="house">House</option>
                <option value="apartment">Apartment</option>
                <option value="condo">Condominium</option>
                <option value="commercial">Commercial</option>
            </select>
            <div id="property_type-error" class="error" aria-live="polite"></div>
        </div>

        <div class="form-group">
            <label for="special_requirements">Special Requirements:</label>
            <textarea id="special_requirements" name="special_requirements" aria-describedby="special_requirements-error" 
                      placeholder="Any special requirements or areas of concern..."></textarea>
            <div id="special_requirements-error" class="error" aria-live="polite"></div>
        </div>

        <button type="submit">Submit Inspection Request</button>
    </form>

    <!-- Form summary will be inserted here -->
    <div id="form-summary-container" class="hidden"></div>

    <!-- Load the required scripts -->
    <script src="src/js/form-handler-core.js"></script>
    <script src="src/js/form-extension-loader.js"></script>
    <script src="src/js/extensions/form-validation.js"></script>
    <script src="src/js/extensions/form-confirmation.js"></script>
    <script src="src/js/inspection_1-migrated.js"></script>

    <script>
        // Debug logging
        console.log('=== Inspection Form Test Debug ===');
        console.log('FormHandler available:', typeof FormHandler !== 'undefined');
        console.log('FormExtensionLoader available:', typeof FormExtensionLoader !== 'undefined');
        console.log('FormValidationExtension available:', typeof FormValidationExtension !== 'undefined');
        console.log('FormConfirmationExtension available:', typeof FormConfirmationExtension !== 'undefined');
        
        // Test form submission handling
        document.getElementById('inspection1Form').addEventListener('submit', function(e) {
            e.preventDefault();
            console.log('Form submission intercepted for testing');
            
            // Simulate successful submission after validation
            setTimeout(() => {
                console.log('Simulating successful form submission');
                alert('Form submitted successfully! (This is a test)');
            }, 1000);
        });
    </script>
</body>
</html>

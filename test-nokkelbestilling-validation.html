<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Nokkelbestilling Form Validation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .test-container { max-width: 800px; margin: 2rem auto; padding: 2rem; }
        .is-invalid { border-color: #dc3545; }
        .is-valid { border-color: #28a745; }
        .invalid-feedback { display: block; color: #dc3545; font-size: 0.875em; margin-top: 0.25rem; }
        .error-summary { 
            background-color: #f8d7da; 
            border: 1px solid #f5c6cb; 
            color: #721c24; 
            padding: 1rem; 
            margin-bottom: 1rem; 
            border-radius: 0.25rem;
        }
        .error-summary h3 { color: #721c24; font-size: 1.25rem; margin-bottom: 0.5rem; }
        .error-summary ul { margin-bottom: 0; }
        .error-summary a { color: #721c24; text-decoration: underline; }
        .console-output { 
            background: #f8f9fa; 
            border: 1px solid #dee2e6; 
            padding: 1rem; 
            margin-top: 1rem; 
            font-family: monospace; 
            white-space: pre-wrap; 
            max-height: 300px; 
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Test Nokkelbestilling Form Validation</h1>
        <p>This page tests the form validation system. Click "Test Validation" to submit the form without filling required fields.</p>
        
        <div id="console-output" class="console-output">Console output will appear here...\n</div>
        
        <form id="nokkelbestilling-form" novalidate>
            <!-- Order on behalf field -->
            <div class="form-group mt-2">
                <label for="paavegne_av" class="required">Order on behalf of *</label>
                <input type="text" id="paavegne_av" name="paavegne_av" class="form-control" required aria-required="true" />
            </div>
            
            <!-- Phone field -->
            <div class="form-group mt-2">
                <label for="phone" class="required">Phone *</label>
                <input type="text" id="phone" name="phone" class="form-control" required aria-required="true" />
            </div>
            
            <!-- Email field -->
            <div class="form-group mt-2">
                <label for="email" class="required">Email *</label>
                <input type="email" id="email" name="email" class="form-control" required aria-required="true" />
            </div>
            
            <!-- Key number field -->
            <div class="form-group mt-2">
                <label for="key_number" class="required">Key Number *</label>
                <input type="text" id="key_number" name="key_number" class="form-control" required aria-required="true" />
            </div>
            
            <!-- Number of keys field -->
            <div class="form-group mt-2">
                <label for="number_of_keys" class="required">Number of Keys *</label>
                <input type="number" id="number_of_keys" name="number_of_keys" class="form-control" required aria-required="true" min="1" />
            </div>
            
            <!-- Subject field -->
            <div class="form-group mt-2">
                <label for="subject" class="required">Subject *</label>
                <input type="text" id="subject" name="subject" class="form-control" required aria-required="true" value="Key order summary" readonly />
            </div>
            
            <button type="submit" class="btn btn-primary mt-3">Test Validation</button>
            <button type="button" id="fill-form" class="btn btn-secondary mt-3">Fill Form (Valid)</button>
            <button type="button" id="fill-invalid" class="btn btn-warning mt-3">Fill Form (Invalid)</button>
            <button type="button" id="clear-form" class="btn btn-outline-secondary mt-3">Clear Form</button>
        </form>
        
        <div id="form-status" class="sr-only" aria-live="assertive"></div>
    </div>

    <script src="vendor/components/jquery/jquery.min.js"></script>
    <script>
        // Console logging override to capture output
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const consoleOutput = document.getElementById('console-output');
        
        function logToPage(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'error' ? '❌ ERROR' : '🔍 LOG';
            consoleOutput.textContent += `[${timestamp}] ${prefix}: ${message}\n`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }
        
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            logToPage(args.join(' '));
        };
        
        console.error = function(...args) {
            originalConsoleError.apply(console, args);
            logToPage(args.join(' '), 'error');
        };
        
        console.log('🚀 Test page loaded, starting form validation test...');
    </script>
    
    <!-- Load the actual form handler system -->
    <script src="src/js/form-handler-core.js"></script>
    <script src="src/js/extensions/form-validation.js"></script>
    <script src="src/js/extensions/form-autosave.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔧 DOM loaded, initializing form handler...');
            
            try {
                // Initialize the form handler with validation extension
                const formElement = document.getElementById('nokkelbestilling-form');
                if (!formElement) {
                    console.error('❌ Form element not found');
                    return;
                }
                
                const formHandler = new FormHandler({
                    formId: 'nokkelbestilling-form',
                    redirectUrl: '/test',
                    uploadUrl: '/test/upload',
                    extensions: {
                        validation: {
                            realTimeValidation: true,
                            wcagCompliant: true
                        },
                        autoSave: {
                            interval: 45000,
                            storageKey: 'test_autosave'
                        }
                    }
                });
                
                // Register extensions
                if (typeof FormValidationExtension !== 'undefined') {
                    FormHandler.registerExtension('validation', FormValidationExtension);
                    console.log('✅ Validation extension registered statically');
                } else {
                    console.error('❌ FormValidationExtension not found');
                }
                
                if (typeof FormAutosaveExtension !== 'undefined') {
                    FormHandler.registerExtension('autoSave', FormAutosaveExtension);
                    console.log('✅ Autosave extension registered statically');
                }
                
                console.log('✅ Form handler initialized successfully');
                console.log('📋 Registered extensions:', Object.keys(formHandler.extensions || {}));
                
                // Test buttons
                document.getElementById('fill-form').addEventListener('click', function() {
                    console.log('📝 Filling form with valid data...');
                    document.getElementById('paavegne_av').value = 'John Doe';
                    document.getElementById('phone').value = '12345678';
                    document.getElementById('email').value = 'john@example.com';
                    document.getElementById('key_number').value = 'KEY123';
                    document.getElementById('number_of_keys').value = '2';
                });
                
                document.getElementById('fill-invalid').addEventListener('click', function() {
                    console.log('❌ Filling form with invalid data...');
                    document.getElementById('paavegne_av').value = 'John Doe';
                    document.getElementById('phone').value = '123'; // Too short
                    document.getElementById('email').value = 'invalid-email'; // Invalid format
                    document.getElementById('key_number').value = 'KEY123';
                    document.getElementById('number_of_keys').value = '2';
                });
                
                document.getElementById('clear-form').addEventListener('click', function() {
                    console.log('🗑️ Clearing form...');
                    document.getElementById('nokkelbestilling-form').reset();
                    // Clear any validation classes
                    document.querySelectorAll('.is-invalid, .is-valid').forEach(el => {
                        el.classList.remove('is-invalid', 'is-valid');
                    });
                    // Clear error summary
                    const errorSummary = document.querySelector('.error-summary');
                    if (errorSummary) {
                        errorSummary.remove();
                    }
                });
                
            } catch (error) {
                console.error('❌ Failed to initialize form handler:', error);
            }
        });
    </script>
</body>
</html>

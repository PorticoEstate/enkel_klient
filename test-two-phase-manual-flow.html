<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Phase Form Submission - Manual Flow Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="src/css/file-uploader-enhanced.css" rel="stylesheet">
    <style>
        .main-container { 
            max-width: 800px; 
            margin: 40px auto; 
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .debug-panel {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
        }
        .debug-log {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.4;
        }
        .log-entry {
            margin: 3px 0;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .log-info { background: #d1ecf1; }
        .log-success { background: #d4edda; }
        .log-warning { background: #fff3cd; }
        .log-error { background: #f8d7da; }
        .feature-section {
            background: white;
            border: 1px solid #dee2e6;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .button-row {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }
        .file-upload-zone {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            transition: all 0.3s ease;
        }
        .file-upload-zone:hover, .file-upload-zone.is-dragover {
            border-color: #007bff;
            background: rgba(0, 123, 255, 0.05);
        }
        .phase-display {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #6c757d;
        }
        .phase-display.active-1 {
            border-left-color: #28a745;
        }
        .phase-display.active-2 {
            border-left-color: #007bff;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <h1 class="mb-4">Two-Phase Form with Manual Flow</h1>
        
        <div class="phase-display mb-4" id="phase-status">
            <h4>Current Status:</h4>
            <ul class="mb-0">
                <li><strong>Record ID:</strong> <span id="record-id-display">None</span></li>
                <li><strong>Current Phase:</strong> <span id="current-phase-display">Ready to start</span></li>
                <li><strong>Files:</strong> <span id="file-count-display">0 files pending</span></li>
            </ul>
        </div>
        
        <div class="feature-section">
            <h3>Test Form</h3>
            <form id="test-form" action="api/helpdesk/add" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="title" name="title" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="category" class="form-label">Category</label>
                    <select class="form-control" id="category" name="category">
                        <option value="question">Question</option>
                        <option value="problem">Problem</option>
                        <option value="request">Request</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="fileupload" class="form-label">Attachments</label>
                    <div id="drop-area" class="file-upload-zone">
                        <p>Drop files here or <button type="button" id="file-select-btn" class="btn btn-sm btn-outline-secondary">browse for files</button></p>
                        <input type="file" id="fileupload" name="files[]" multiple style="display:none">
                    </div>
                    <div id="content_upload_download" class="mb-3">
                        <div class="presentation files"></div>
                    </div>
                </div>
                <div class="button-row">
                    <button type="button" class="btn btn-outline-secondary" id="show-summary-btn">Show Summary</button>
                    <button type="submit" class="btn btn-primary">Submit Form</button>
                </div>
            </form>
        </div>
        
        <div class="feature-section">
            <h3>Manual Testing Controls</h3>
            <p>Use these controls to test the two-phase submission process manually:</p>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <button type="button" class="btn btn-success w-100" id="run-phase1-btn">
                        Run Phase 1 <small class="d-block text-light opacity-75">Submit form data only</small>
                    </button>
                </div>
                <div class="col-md-6">
                    <button type="button" class="btn btn-primary w-100" id="run-phase2-btn" disabled>
                        Run Phase 2 <small class="d-block text-light opacity-75">Upload files with record ID</small>
                    </button>
                </div>
            </div>
            
            <div class="input-group mb-3">
                <input type="text" class="form-control" id="manual-record-id" placeholder="Enter record ID for testing">
                <button class="btn btn-outline-secondary" type="button" id="set-id-btn">Set ID</button>
            </div>
        </div>
        
        <div class="debug-panel">
            <h4>Debug Console</h4>
            <div id="debug-log" class="debug-log"></div>
        </div>
    </div>

    <!-- Load required scripts -->
    <script src="vendor/components/jquery/jquery.min.js"></script>
    <script src="src/js/file-uploader.js"></script>
    <script src="src/js/form-handler.js"></script>
    <script src="src/js/extensions/form-two-phase-submit.js"></script>
    
    <!-- Test script -->
    <script>
        $(document).ready(function() {
            // Debug logging to page
            const originalConsoleLog = console.log;
            const originalConsoleError = console.error;
            const originalConsoleWarn = console.warn;
            
            function addToDebugLog(message, type = 'info') {
                const $logContainer = $('#debug-log');
                const timestamp = new Date().toLocaleTimeString();
                let msgStr = message;
                
                if (typeof message === 'object') {
                    try {
                        msgStr = JSON.stringify(message);
                    } catch(e) {
                        msgStr = '[Object]';
                    }
                }
                
                $logContainer.append(`<div class="log-entry log-${type}"><strong>${timestamp}:</strong> ${msgStr}</div>`);
                $logContainer.scrollTop($logContainer[0].scrollHeight);
            }
            
            // Override console methods to also log to the page
            console.log = function(message) {
                originalConsoleLog.apply(console, arguments);
                addToDebugLog(message, 'info');
            };
            
            console.error = function(message) {
                originalConsoleError.apply(console, arguments);
                addToDebugLog(message, 'error');
            };
            
            console.warn = function(message) {
                originalConsoleWarn.apply(console, arguments);
                addToDebugLog(message, 'warning');
            };
            
            // Setup mock API endpoint
            $.mockjax({
                url: "api/helpdesk/add*",
                responseTime: 1200,
                response: function(settings) {
                    const hasPhase2 = settings.url.includes('phase2=true');
                    
                    if (hasPhase2) {
                        console.log('Received Phase 2 request with file upload');
                        this.responseText = JSON.stringify({
                            status: "uploaded",
                            message: "Files uploaded successfully"
                        });
                    } else {
                        console.log('Received Phase 1 request for form data');
                        this.responseText = JSON.stringify({
                            status: "saved",
                            id: "TEST-" + Math.floor(Math.random() * 10000),
                            message: "Form data saved successfully"
                        });
                    }
                }
            });
            
            // Set up form handler with extensions
            window.strBaseURL = ''; // Mock base URL for file paths
            
            // Initialize FormHandler for the test form
            const formHandler = new FormHandler('#test-form', {
                validateOnSubmit: true,
                showFormErrors: true,
                redirectUrl: '#success'  // Redirect URL after submission
            });
            
            // Set up two-phase submission extension
            const twoPhaseExt = new FormTwoPhaseSubmitExtension(formHandler, {
                showSummary: true,
                enableFileUpload: true
            });
            formHandler.extensions.twoPhaseSubmit = twoPhaseExt;
            
            // UI update functions
            function updateUI() {
                const recordId = twoPhaseExt.recordId;
                const fileCount = twoPhaseExt.getFileCount();
                
                $('#record-id-display').text(recordId || 'None');
                $('#file-count-display').text(fileCount + ' files pending');
                
                if (recordId) {
                    $('#run-phase2-btn').prop('disabled', false);
                    $('#phase-status').removeClass('active-1').addClass('active-2');
                    $('#current-phase-display').text('Ready for Phase 2 (File Upload)');
                } else {
                    $('#run-phase2-btn').prop('disabled', true);
                    $('#phase-status').removeClass('active-2').addClass('active-1');
                    $('#current-phase-display').text('Ready for Phase 1 (Form Data)');
                }
            }
            
            // Event handlers
            $('#run-phase1-btn').on('click', function() {
                twoPhaseExt.manualRunPhase1();
                // Update UI after a delay to let the process complete
                setTimeout(updateUI, 2000);
            });
            
            $('#run-phase2-btn').on('click', function() {
                twoPhaseExt.manualRunPhase2();
            });
            
            $('#set-id-btn').on('click', function() {
                const manualId = $('#manual-record-id').val().trim();
                if (manualId) {
                    twoPhaseExt.recordId = manualId;
                    updateUI();
                    console.log('Record ID manually set to:', manualId);
                }
            });
            
            $('#show-summary-btn').on('click', function() {
                twoPhaseExt.handleConfirmationBeforeSubmit();
            });
            
            // Initialize UI
            updateUI();
            
            console.log('Form setup complete. Ready to test two-phase submission with manual flow.');
        });
    </script>
    
    <!-- MockJax for mocking AJAX requests during testing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-mockjax/2.6.0/jquery.mockjax.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation Fix Test</title>
    <link href="vendor/twbs/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1>Testing Validation Extension Fix</h1>
        <p>This page tests if the FormValidationExtension redeclaration error has been fixed.</p>
        
        <div id="test-results">
            <p><strong>Status:</strong> <span id="status">Loading...</span></p>
            <p><strong>Errors:</strong> <span id="errors">None detected</span></p>
        </div>
        
        <form id="test-form" class="mt-4">
            <div class="mb-3">
                <label for="email" class="form-label">Email (required)</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="tel" id="phone" name="phone" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary">Test Submit</button>
        </form>
    </div>

    <!-- Load dependencies in correct order -->
    <script src="vendor/components/jquery/jquery.min.js"></script>
    <script>
        var strBaseURL = window.location.origin;
        var translations = {
            form_validation_errors: "Please fix the following errors:",
            invalid_email: "Please enter a valid email address",
            invalid_phone: "Please enter a valid phone number"
        };
    </script>
    
    <!-- Load accessibility helpers -->
    <script src="src/js/accessibility-helpers.js"></script>
    
    <!-- Load form core and extensions -->
    <script src="src/js/form-handler-core.js"></script>
    <script src="src/js/form-extension-loader.js"></script>
    <script src="src/js/extensions/form-validation.js"></script>
    
    <script>
        let testErrors = [];
        let testStatus = 'Loading...';
        
        // Capture JavaScript errors
        window.addEventListener('error', function(e) {
            testErrors.push(e.message);
            document.getElementById('errors').textContent = testErrors.join('; ');
        });
        
        // Test the form validation extension
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Test if FormValidationExtension loads without redeclaration error
                const formHandler = new FormHandler({
                    formId: 'test-form',
                    redirectUrl: '#'
                });
                
                // Try to load validation extension
                formHandler.loadExtension('validation', {
                    realTimeValidation: true,
                    wcagCompliant: true
                });
                
                testStatus = '✅ Success - No redeclaration errors!';
                document.getElementById('status').textContent = testStatus;
                document.getElementById('status').className = 'text-success';
                
                console.log('✅ Form validation extension loaded successfully');
                
            } catch (error) {
                testStatus = '❌ Error: ' + error.message;
                document.getElementById('status').textContent = testStatus;
                document.getElementById('status').className = 'text-danger';
                testErrors.push(error.message);
                document.getElementById('errors').textContent = testErrors.join('; ');
                
                console.error('❌ Form validation test failed:', error);
            }
        });
    </script>
</body>
</html>
